<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a11"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle grid lines -->
  <line x1="64" y1="160" x2="448" y2="160" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="64" y1="352" x2="448" y2="352" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="160" y1="80" x2="160" y2="432" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="352" y1="80" x2="352" y2="432" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Candlesticks (Historical) -->
  <!-- Candle 1: Red -->
  <line x1="120" y1="210" x2="120" y2="310" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <rect x="110" y="235" width="20" height="50" rx="4" fill="#ef4444"/>

  <!-- Candle 2: Green Rebound -->
  <line x1="180" y1="190" x2="180" y2="330" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <rect x="170" y="220" width="20" height="75" rx="4" fill="#10b981"/>

  <!-- Candle 3: Green Continuation -->
  <line x1="240" y1="160" x2="240" y2="280" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <rect x="230" y="180" width="20" height="65" rx="4" fill="#10b981"/>

  <!-- Predictive 15-Minute Forecast Zone (Glow & Projected Candlesticks) -->
  <path d="M 240,210 Q 300,160 380,120 L 410,105" fill="none" stroke="#00f59b" stroke-width="4" stroke-dasharray="6,4" filter="url(#glow)"/>
  
  <!-- Predicted Future Candle 4: Projected -->
  <line x1="310" y1="130" x2="310" y2="230" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="3,3"/>
  <rect x="300" y="150" width="20" height="55" rx="4" fill="#06b6d4" fill-opacity="0.75" stroke="#38bdf8" stroke-width="2"/>

  <!-- Predicted Future Candle 5: Strong Bullish Target -->
  <line x1="380" y1="90" x2="380" y2="190" stroke="#10b981" stroke-width="3"/>
  <rect x="370" y="110" width="20" height="60" rx="4" fill="#10b981" filter="url(#glow)"/>

  <!-- Target Aim Node -->
  <circle cx="410" cy="105" r="7" fill="#00f59b" filter="url(#glow)"/>
  <circle cx="410" cy="105" r="14" fill="none" stroke="#00f59b" stroke-width="2" opacity="0.6"/>

  <!-- AI Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.4"/>

  <!-- JIT Badge Text -->
  <g transform="translate(256, 430)">
    <rect x="-140" y="-36" width="280" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text text-anchor="middle" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="4">JIT PREDICT</text>
  </g>
</svg>
